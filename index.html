<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Login</title>
<style>
  :root {
  --bg-darkest: #1e1f22;
  --bg-modal: #313338;
  --bg-input: #1e1f22;
  --bg-secondary: #2b2d31;
  --text-normal: #f2f3f5;
  --text-muted: #b5bac1;
  --text-link: #00a8fc;
  --brand: #5865f2;
  --brand-hover: #4752c4;
  --danger: #fa777c;
  --divider: #3f4147;
}

/* =========================
   RESET
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family:
    "gg sans",
    "Noto Sans",
    "Helvetica Neue",
    Helvetica,
    Arial,
    sans-serif;

  color: var(--text-normal);

  display: flex;
  align-items: center;
  justify-content: center;

  overflow-x: hidden;

  /*
    Purple/blue Discord-style background
  */
  background:
    radial-gradient(
      circle at 12% 20%,
      rgba(88, 101, 242, 0.38) 0,
      transparent 25%
    ),
    radial-gradient(
      circle at 88% 25%,
      rgba(72, 45, 180, 0.32) 0,
      transparent 28%
    ),
    radial-gradient(
      circle at 70% 85%,
      rgba(46, 70, 160, 0.35) 0,
      transparent 32%
    ),
    linear-gradient(
      135deg,
      #170653 0%,
      #25106d 45%,
      #171a4c 100%
    );
}

/* =========================
   BACKGROUND DECORATION
========================= */

.bg-shape {
  position: fixed;
  pointer-events: none;
  z-index: 0;

  border-radius: 50%;

  filter: blur(2px);
}

.bg-shape.s1 {
  width: 170px;
  height: 170px;

  top: 12%;
  left: 9%;

  background: rgba(88, 101, 242, 0.18);
}

.bg-shape.s2 {
  width: 110px;
  height: 110px;

  right: 12%;
  bottom: 13%;

  background: rgba(88, 101, 242, 0.15);
}

.bg-shape.s3 {
  width: 55px;
  height: 55px;

  right: 24%;
  top: 24%;

  background: rgba(255, 255, 255, 0.06);
}

/* Extra decorative glow */

body::before {
  content: "";

  position: fixed;
  z-index: 0;

  width: 420px;
  height: 420px;

  left: -180px;
  bottom: -180px;

  border-radius: 50%;

  background: rgba(76, 50, 200, 0.22);

  filter: blur(60px);

  pointer-events: none;
}

body::after {
  content: "";

  position: fixed;
  z-index: 0;

  width: 350px;
  height: 350px;

  right: -140px;
  top: -120px;

  border-radius: 50%;

  background: rgba(65, 45, 190, 0.2);

  filter: blur(60px);

  pointer-events: none;
}

/* =========================
   MAIN LOGIN CARD
========================= */

.modal {
  position: relative;
  z-index: 2;

  width: 760px;
  max-width: calc(100vw - 40px);

  padding: 32px;

  background: rgba(49, 51, 56, 0.98);

  border-radius: 8px;

  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.35),
    0 16px 48px rgba(0, 0, 0, 0.25);
}

/* =========================
   HEADER
========================= */

.modal-header {
  width: 100%;

  text-align: center;

  margin: 0;
}

/*
  Discord wordmark
*/

.logo {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 100%;

  margin: 0 0 18px;
}

.logo-img {
  display: block;

  width: 180px;
  height: auto;

  max-width: 70%;

  object-fit: contain;
}

/*
  If an SVG is ever used
*/

.logo svg {
  width: 180px;
  height: auto;
}

/* =========================
   TITLE
========================= */

.modal h1 {
  margin: 0 0 8px;

  color: var(--text-normal);

  font-size: 24px;
  line-height: 30px;

  font-weight: 600;

  letter-spacing: -0.2px;
}

.modal p.subtitle {
  margin: 0;

  color: var(--text-muted);

  font-size: 14px;
  line-height: 20px;
}

/* =========================
   FORM
========================= */

form {
  width: 100%;

  margin-top: 24px;

  display: grid;

  grid-template-columns: minmax(0, 1fr) 240px;

  grid-template-rows: auto auto auto auto auto;

  column-gap: 42px;
  row-gap: 18px;

  align-items: start;
}

/* =========================
   INPUT FIELDS
========================= */

.field {
  width: 100%;

  display: flex;
  flex-direction: column;

  gap: 8px;
}

.field label {
  color: var(--text-muted);

  font-size: 12px;
  line-height: 16px;

  font-weight: 700;

  text-transform: uppercase;

  letter-spacing: 0.02em;
}

.field label .required {
  color: var(--danger);

  margin-left: 2px;
}

.field input {
  width: 100%;
  height: 40px;

  padding: 10px;

  background: var(--bg-input);

  border: 1px solid #1e1f22;

  border-radius: 3px;

  color: var(--text-normal);

  font-family: inherit;

  font-size: 16px;

  outline: none;

  transition:
    border-color 0.15s ease,
    box-shadow 0.15s ease;
}

.field input:hover {
  border-color: #111214;
}

.field input:focus {
  border-color: var(--brand);

  box-shadow:
    0 0 0 1px var(--brand);
}

.field input::placeholder {
  color: #72767d;
}

/* =========================
   ERROR
========================= */

.field .error-text {
  display: none;

  color: var(--danger);

  font-size: 12px;
  line-height: 16px;
}

.field.error input {
  border-color: var(--danger);
}

.field.error .error-text {
  display: block;
}

/* =========================
   FORGOT PASSWORD
========================= */

.forgot-link {
  color: var(--text-link);

  font-size: 13px;
  line-height: 16px;

  text-decoration: none;

  align-self: flex-start;
}

.forgot-link:hover {
  text-decoration: underline;
}

/* =========================
   LOGIN BUTTON
========================= */

.submit-btn {
  width: 100%;
  height: 44px;

  margin-top: 2px;

  padding: 2px 16px;

  background: var(--brand);

  color: #fff;

  border: none;

  border-radius: 3px;

  font-family: inherit;

  font-size: 16px;
  font-weight: 500;

  cursor: pointer;

  transition:
    background-color 0.15s ease,
    transform 0.05s ease;
}

.submit-btn:hover {
  background: var(--brand-hover);
}

.submit-btn:active {
  transform: translateY(1px);
}

.submit-btn:disabled {
  opacity: 0.6;

  cursor: not-allowed;
}

/* =========================
   REGISTER
========================= */

.need-account {
  margin: 0;

  color: var(--text-muted);

  font-size: 13px;
  line-height: 18px;
}

.need-account a {
  color: var(--text-link);

  text-decoration: none;
}

.need-account a:hover {
  text-decoration: underline;
}

/* =========================
   QR SIDE
========================= */

.qr-hint {
  /*
    Put QR area on right side
  */

  grid-column: 2;

  grid-row: 1 / span 5;

  min-height: 250px;

  margin: 0;

  padding: 0 0 0 30px;

  border-left: 1px solid var(--divider);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  gap: 14px;
}

.qr-hint p {
  max-width: 220px;

  margin: 0;

  color: var(--text-muted);

  font-size: 13px;

  line-height: 18px;
}

/* QR square */

.qr-box {
  width: 160px;
  height: 160px;

  flex-shrink: 0;

  background: #fff;

  border-radius: 6px;

  display: flex;

  align-items: center;
  justify-content: center;

  color: #111;

  font-size: 12px;

  font-weight: 500;

  box-shadow:
    0 2px 8px rgba(0, 0, 0, 0.15);
}

/* =========================
   ACCESSIBILITY
========================= */

input:focus-visible,
a:focus-visible,
button:focus-visible {
  outline: 2px solid #fff;

  outline-offset: 2px;
}

.visually-hidden {
  position: absolute;

  width: 1px;
  height: 1px;

  padding: 0;
  margin: -1px;

  overflow: hidden;

  clip: rect(0, 0, 0, 0);

  white-space: nowrap;

  border: 0;
}

/* =========================
   TABLET
========================= */

@media (max-width: 800px) {

  .modal {
    width: 700px;

    padding: 28px;
  }

  form {
    grid-template-columns: minmax(0, 1fr) 210px;

    column-gap: 28px;
  }

  .qr-hint {
    padding-left: 24px;
  }

  .qr-box {
    width: 140px;
    height: 140px;
  }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

  body {
    min-height: 100vh;

    padding: 20px 0;
  }

  .modal {
    width: calc(100vw - 24px);

    max-width: 480px;

    padding: 28px 24px;

    border-radius: 8px;
  }

  .logo-img {
    width: 150px;
  }

  .modal h1 {
    font-size: 22px;
  }

  form {
    display: flex;

    flex-direction: column;

    gap: 18px;

    margin-top: 22px;
  }

  .qr-hint {
    width: 100%;

    min-height: 0;

    margin-top: 4px;

    padding: 20px 0 0;

    border-left: 0;

    border-top: 1px solid var(--divider);

    display: flex;

    flex-direction: column;
  }

  .qr-box {
    width: 120px;
    height: 120px;
  }
}

/* =========================
   SMALL PHONES
========================= */

@media (max-width: 400px) {

  body {
    padding: 0;
  }

  .modal {
    width: 100vw;

    min-height: 100vh;

    max-width: none;

    border-radius: 0;

    padding: 28px 20px;

    display: flex;

    flex-direction: column;

    justify-content: center;
  }

  .logo-img {
    width: 140px;
  }

  .modal h1 {
    font-size: 21px;
  }

  .field input {
    height: 42px;
  }

  .qr-hint {
    display: none;
  }
}
</style>
</head>
<body>

  <div class="bg-shape s1"></div>
  <div class="bg-shape s2"></div>
  <div class="bg-shape s3"></div>

  <main class="modal" role="main">
    <div class="modal-header">
      <div class="logo">
       <img src="./logo.png" alt="Discord" class="logo-img">
      </div>
    <h1>Welcome back!</h1>

    <form id="login-form" novalidate>
      <div class="field" id="email-field">
        <label for="email">Email or Username <span class="required">*</span></label>
        <input type="text" id="email" name="email" autocomplete="username" required>
        <span class="error-text">Please enter a valid email or username.</span>
      </div>

      <div class="field" id="password-field">
        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <span class="error-text">Please enter your password.</span>
        <a href="#" class="forgot-link">Forgot your password?</a>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Log In</button>

      <p class="need-account">Need an account? <a href="#" id="register-link">Register</a></p>

      <div class="qr-hint">
        <p>You can also log in with a QR code , scan it with the Discord mobile app.</p>
        <div class="qr-box">QR</div>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const emailField = document.getElementById('email-field');
    const passwordField = document.getElementById('password-field');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');

    function clearError(fieldEl){
      fieldEl.classList.remove('error');
    }

    function setError(fieldEl){
      fieldEl.classList.add('error');
    }

    emailInput.addEventListener('input', () => clearError(emailField));
    passwordInput.addEventListener('input', () => clearError(passwordField));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      let valid = true;
      if(!emailInput.value.trim()){
        setError(emailField);
        valid = false;
      }
      if(!passwordInput.value.trim()){
        setError(passwordField);
        valid = false;
      }
      if(!valid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login: emailInput.value.trim(),
            password: passwordInput.value
          })
        });

        if(!response.ok){
          const data = await response.json().catch(() => ({}));
          setError(passwordField);
          passwordField.querySelector('.error-text').textContent =
            data.message || 'Login failed. Check your credentials.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
          return;
        }

        const data = await response.json();
        if(data.token){
          localStorage.setItem('discord_token', data.token);
        }
        window.location.href = '/app';

      } catch (err){
        console.error('Login error:', err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
        setError(passwordField);
        passwordField.querySelector('.error-text').textContent =
          'Something went wrong. Please try again.';
      }
    });
  </script>

</body>
</html>
