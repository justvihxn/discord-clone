<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Login</title>
<style>
  :root{
    --bg-darkest: #1e1f22;
    --bg-modal: #313338;
    --bg-input: #1e1f22;
    --bg-secondary: #2b2d31;
    --text-normal: #f2f3f5;
    --text-muted: #949ba4;
    --text-link: #00a8fc;
    --brand: #5865f2;
    --brand-hover: #4752c4;
    --danger: #fa777c;
    --field-border: #1e1f22;
    --divider: #3f4147;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background-color: var(--bg-darkest);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background: radial-gradient(circle at 20% 20%, #2b2d5e 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, #1c2e52 0%, transparent 50%),
                var(--bg-darkest);
    overflow:hidden;
  }

  .bg-shape{
    position:fixed;
    border-radius:50%;
    filter: blur(2px);
    opacity:0.5;
    pointer-events:none;
  }
  .bg-shape.s1{ width:120px; height:120px; top:8%; left:12%; background:#5865f2; opacity:0.15; }
  .bg-shape.s2{ width:80px; height:80px; bottom:14%; right:16%; background:#5865f2; opacity:0.12; }
  .bg-shape.s3{ width:50px; height:50px; top:20%; right:22%; background:#fff; opacity:0.05; }

  .modal{
    position:relative;
    z-index:2;
    background-color: var(--bg-modal);
    border-radius:8px;
    width:480px;
    max-width:90vw;
    padding:32px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  .modal-header{
    text-align:center;
    margin-bottom:20px;
  }

  .logo{
    display:flex;
    justify-content:center;
    margin-bottom:16px;
  }

  .logo svg{ width:48px; height:48px; }

  .logo-img{
    width:48px;
    height:48px;
    object-fit:contain;
  }

  .logo-placeholder{
    width:48px;
    height:48px;
    border-radius:12px;
    background-color: var(--brand);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:700;
    border:2px dashed rgba(255,255,255,0.4);
  }

  .modal h1{
    color: var(--text-normal);
    font-size:24px;
    font-weight:600;
    margin:0 0 8px 0;
  }

  .modal p.subtitle{
    color: var(--text-muted);
    font-size:16px;
    margin:0;
  }

  form{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .field label{
    color: var(--text-muted);
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }

  .field label .required{
    color: var(--danger);
    margin-left:2px;
  }

  .field input{
    background-color: var(--bg-input);
    border: 1px solid var(--field-border);
    border-radius:3px;
    padding:10px;
    color: var(--text-normal);
    font-size:16px;
    outline:none;
    transition: border-color 0.15s ease;
  }

  .field input:focus{
    border-color: var(--brand);
  }

  .field .error-text{
    color: var(--danger);
    font-size:12px;
    display:none;
  }

  .field.error input{
    border-color: var(--danger);
  }

  .field.error .error-text{
    display:block;
  }

  .forgot-link{
    color: var(--text-link);
    font-size:14px;
    text-decoration:none;
    align-self:flex-start;
  }

  .forgot-link:hover{
    text-decoration:underline;
  }

  .submit-btn{
    background-color: var(--brand);
    color:#fff;
    border:none;
    border-radius:3px;
    padding:12px;
    font-size:16px;
    font-weight:500;
    cursor:pointer;
    transition: background-color 0.15s ease;
  }

  .submit-btn:hover{
    background-color: var(--brand-hover);
  }

  .submit-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
  }

  .need-account{
    font-size:14px;
    color: var(--text-muted);
    margin:0;
  }

  .need-account a{
    color: var(--text-link);
    text-decoration:none;
  }

  .need-account a:hover{
    text-decoration:underline;
  }

  .qr-hint{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid var(--divider);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .qr-hint p{
    color: var(--text-muted);
    font-size:13px;
    margin:0;
    line-height:1.4;
  }

  .qr-box{
    width:56px;
    height:56px;
    background:#fff;
    border-radius:6px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    color:#000;
  }

  @media (max-width: 500px){
    .modal{
      border-radius:0;
      width:100%;
      height:100%;
      max-width:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .qr-hint{ display:none; }
    body{ overflow:auto; }
  }

  .visually-hidden{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
  }

  input:focus-visible, a:focus-visible, button:focus-visible{
    outline: 2px solid #fff;
    outline-offset:2px;
  }
</style>
</head>
<body>

  <div class="bg-shape s1"></div>
  <div class="bg-shape s2"></div>
  <div class="bg-shape s3"></div>

  <main class="modal" role="main">
    <div class="modal-header">
      <div class="logo">
       <img src="./logo.png" alt="Discord" class="logo-img">
      </div>
    <h1>Welcome back!</h1>

    <form id="login-form" novalidate>
      <div class="field" id="email-field">
        <label for="email">Email or Username <span class="required">*</span></label>
        <input type="text" id="email" name="email" autocomplete="username" required>
        <span class="error-text">Please enter a valid email or username.</span>
      </div>

      <div class="field" id="password-field">
        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <span class="error-text">Please enter your password.</span>
        <a href="#" class="forgot-link">Forgot your password?</a>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Log In</button>

      <p class="need-account">Need an account? <a href="#" id="register-link">Register</a></p>

      <div class="qr-hint">
        <p>You can also log in with a QR code , scan it with the Discord mobile app.</p>
        <div class="qr-box">QR</div>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const emailField = document.getElementById('email-field');
    const passwordField = document.getElementById('password-field');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');

    function clearError(fieldEl){
      fieldEl.classList.remove('error');
    }

    function setError(fieldEl){
      fieldEl.classList.add('error');
    }

    emailInput.addEventListener('input', () => clearError(emailField));
    passwordInput.addEventListener('input', () => clearError(passwordField));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      let valid = true;
      if(!emailInput.value.trim()){
        setError(emailField);
        valid = false;
      }
      if(!passwordInput.value.trim()){
        setError(passwordField);
        valid = false;
      }
      if(!valid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login: emailInput.value.trim(),
            password: passwordInput.value
          })
        });

        if(!response.ok){
          const data = await response.json().catch(() => ({}));
          setError(passwordField);
          passwordField.querySelector('.error-text').textContent =
            data.message || 'Login failed. Check your credentials.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
          return;
        }

        const data = await response.json();
        if(data.token){
          localStorage.setItem('discord_token', data.token);
        }
        window.location.href = '/app';

      } catch (err){
        console.error('Login error:', err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
        setError(passwordField);
        passwordField.querySelector('.error-text').textContent =
          'Something went wrong. Please try again.';
      }
    });
  </script>

</body>
</html>
